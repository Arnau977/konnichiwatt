name: Release

# Pushing a tag like v0.3.1 builds, tests and publishes a release. Installed copies look for
# https://github.com/<owner>/<repo>/releases/latest/download/update.json and update themselves.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test Konnichiwatt.slnx -c Release

      - name: Publish single-file exe + update.json
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./tools/publish.ps1 `
            -BaseUrl "https://github.com/${{ github.repository }}/releases/latest/download" `
            -Version $version -Notes "${{ github.ref_name }}"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            publish/Konnichiwatt.exe publish/update.json publish/Konnichiwatt-portable.zip `
            --title "Konnichiwatt ${{ github.ref_name }}" --generate-notes
